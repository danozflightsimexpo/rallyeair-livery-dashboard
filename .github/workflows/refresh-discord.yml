name: Refresh Discord Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: rallyeair-discord-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update pinned Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          DASHBOARD_TITLE: ${{ vars.DASHBOARD_TITLE }}
        run: node scripts/update-discord.mjs
